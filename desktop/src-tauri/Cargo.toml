[package]
name = "satuwork-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 站外链接交给系统浏览器——壳子里没有地址栏，跳出去就回不来了。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 壳子不该有调试符号那么大。桌面包是用户下载的东西，几 MB 和几十 MB 的区别他们看得见。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
