# Satuwork 的 dsh 配置补丁层
#
# 叠在 dsh-base 与 dsh-web-app 之上。补丁按 id 定位行，**替换该行的整个 config**，
# 所以每一行都要把它拥有的键全部重写；没有 id 的条目是新插入的行。
#
# 应用方式见 README.md。改完必须用 --dump-config 验证。

# ── 模型：只用通用适配器，不要直连 DeepSeek 的那个 ──────────────────────
#
# dsh 出厂带两个 llm 适配器，是它自己的「设计验证孪生」——用两套不同内核实现打
# 同一个 StreamChunk 契约，凡是不能同时表达两边的就是核心词汇表的 bug。那是给
# dsh 维护者的装置，下游维护两套配置面没有收益。
# 见 .agents/notes/implemented/architecture/2026-06-13-twin-llm-adapters.md
- id: llm-deepseek
  disabled: true

# pi-ai 的 catalog route 直接继承它自带 provider 的端点、协议、模型目录，再逐字段
# 覆盖；pi-ai 没有的 route 整个手写声明。加一个 provider 是配置，不是代码。
# apiKeyEnv 是凭据「引用」，按请求经 ctx.credentials 解析，密钥不进这个文件。
- id: llm-pi-ai
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        models:
          - id: claude-sonnet-4-5
            contextWindow: 200000

# 路由名变了：llm-deepseek 注册的是 `deepseek-official`，pi-ai 的目录 route 叫
# `deepseek`。停用前者后这里必须改指，否则加载即失败（dsh 的规矩是响亮失败，
# 不会静默降级）。
- id: agent-default-model
  config:
    provider: deepseek
    model: deepseek-v4-pro

# ── 遥测：关死 ────────────────────────────────────────────────────────────
#
# 出厂 exporter 硬编码指向 harness-telemetry.deepseeksvc.com。默认 mode 已经是
# DISABLED，但这条对「数据不出网」是合规问答里会被问到的东西，显式停用整行，
# 不依赖环境变量的默认值。
- id: session-telemetry-otel
  disabled: true

# ── 会话检索：落盘 ────────────────────────────────────────────────────────
#
# 出厂是 `:memory:` + `openAt: never`（web 表面把全文检索当可选功能）。Satuwork
# 的「全部对话」搜索要用，改成文件 + 首次搜索时打开，让 Node 启动阶段保持安静。
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-index.sqlite')
    openAt: first-search

# ── MCP：出厂 profile 里没有，要自己挂 ────────────────────────────────────
#
# packages/mcp/mcp-client 存在但 dsh-base 和 dsh-web-app 都没挂载它。设计稿的
# Agent 配置页依赖 MCP 服务器列表，所以必须补。
#
# **一个 MCP 服务器一个插件实例**，不是一个插件配一个列表。模型看到的工具名是
# mcp__<serverName>__<rawName>，跟 Claude Code / Codex 同形。serverName 在所有存活
# 实例间必须唯一，重名会让后加载的那个实例失败。
#
# 下面是两种 transport 的模板。真实服务器等 Agent 配置那屏落地时再按需开启。
#
# - id: mcp-notion
#   name: '@deepseek-ai/dsh-mcp-client'
#   config:
#     serverName: notion
#     transport: stdio
#     command: npx
#     args: ['-y', '@notionhq/notion-mcp-server']
#     env:
#       NOTION_TOKEN: !!js process.env.NOTION_TOKEN
#
# - id: mcp-internal
#   name: '@deepseek-ai/dsh-mcp-client'
#   config:
#     serverName: internal
#     transport: streamable-http
#     url: http://127.0.0.1:3100/mcp
#     headers:
#       Authorization: !!js '`Bearer ${process.env.INTERNAL_MCP_TOKEN}`'

# ── TODO：会话持久化 ──────────────────────────────────────────────────────
#
# 出厂是 dsh-session-persistence-jsonl，落在 dshHomePath('sessions')。
# session 根记录里的 version 是 0，README 明确不作兼容承诺，backend 会直接拒绝
# 旧的磁盘格式。会话历史是 Satuwork 的产品资产，不能压在这个格式上。
#
# satu-session-persistence 写完后在这里替换：
#
# - id: session-persistence-jsonl
#   name: '@deepseek-ai/satu-session-persistence'
#   config:
#     root: ...
