<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="theme.css">
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; }
    a { color: var(--color-accent-700); }
    a:hover { color: var(--color-accent-600); }
    .satu-input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .satu-lang { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: color-mix(in srgb, var(--color-text) 7%, transparent); }
    .satu-lang button { border: 0; cursor: pointer; background: transparent; border-radius: 999px; padding: 4px 12px; font-family: var(--font-body); font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
    .satu-lang button:hover { color: var(--color-accent-700); }
    .satu-lang button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-bg); }
    .satu-lang button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  </style>
</helmet>

<div style="min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text);">

  <div style="position: relative; padding: var(--space-8); display: flex; flex-direction: column; justify-content: space-between; background: var(--color-surface); overflow: hidden;">
    <div style="position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; border-radius: 50%; background: var(--color-accent-2-200); opacity: 0.6;"></div>
    <div style="position: relative; display: flex; align-items: center; gap: var(--space-2);">
      <img src="assets/satuwork-logo.png" alt="Satuwork" style="width: 34px; height: 34px; border-radius: 999px;"/>
      <span style="font-family: var(--font-heading); font-size: 20px;">Satuwork</span>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: var(--space-4); max-width: 440px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg);">
        <div class="washed" style="width: 100%; height: 100%;">
          <image-slot id="login-hero" shape="rect" src="assets/login-hero.png" placeholder="放一张 AI 员工工作场景的图片" style="width: 100%; height: 100%;"></image-slot>
        </div>
      </div>
      <p style="font-family: var(--font-heading); font-size: 26px; line-height: 1.2; margin: 0;">{{ t.heroTitle }}</p>
      <p style="margin: 0; color: color-mix(in srgb, var(--color-text) 65%, transparent); font-size: 14px; line-height: 1.6;">{{ t.heroBody }}</p>
    </div>

    <div style="position: relative; display: flex; gap: var(--space-4); font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent);">
      <span>© 2026 Satuwork</span>
      <a href="Privacy Policy.dc.html" style="color: inherit; text-decoration: none;">{{ t.privacy }}</a>
      <a href="Terms of Service.dc.html" style="color: inherit; text-decoration: none;">{{ t.terms }}</a>
    </div>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: center; padding: var(--space-8);">
    <div class="satu-lang" style="position: absolute; top: var(--space-6); right: var(--space-6);">
      <button type="button" onClick="{{ setZh }}" aria-pressed="{{ isZh }}">中文</button>
      <button type="button" onClick="{{ setEn }}" aria-pressed="{{ isEn }}">EN</button>
    </div>

    <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: var(--space-6);">
      <div>
        <h1 style="font-size: 30px; margin: 0 0 var(--space-2);">{{ t.title }}</h1>
        <p style="margin: 0; color: color-mix(in srgb, var(--color-text) 60%, transparent); font-size: 14px;">{{ t.subtitle }}</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: var(--space-4);" onSubmit="{{ handleLogin }}">
        <div class="field">
          <label for="login-email">{{ t.email }}</label>
          <input class="input satu-input" id="login-email" type="email" placeholder="you@company.com" required="{{ true }}"/>
        </div>
        <div class="field">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label for="login-pw" style="margin: 0;">{{ t.password }}</label>
            <a href="#" onclick="{{ noop }}" style="font-size: 12px; text-decoration: none;">{{ t.forgot }}</a>
          </div>
          <input class="input satu-input" id="login-pw" type="password" placeholder="{{ t.pwPlaceholder }}" required="{{ true }}"/>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          {{ t.signIn }}
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <p style="text-align: center; margin: 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 60%, transparent);">
        {{ t.noAccount }} <a href="#" onclick="{{ noop }}" style="text-decoration: none; font-weight: 600;">{{ t.contactUs }}</a>
      </p>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const COPY = {
  zh: {
    heroTitle: '你的云端 AI 员工，随时待命。',
    heroBody: 'Satuwork 部署可执行任务的 AI Agent，接入团队工作流，7x24 小时处理重复工作。',
    privacy: '隐私政策', terms: '服务条款',
    title: '登录 Satuwork', subtitle: '进入控制台，管理你的 AI 员工',
    email: '邮箱', password: '密码', pwPlaceholder: '输入密码',
    forgot: '忘记密码？联系我们', signIn: '登录',
    noAccount: '还没有账号？', contactUs: '联系我们开通',
  },
  en: {
    heroTitle: 'Your cloud AI employee, always on duty.',
    heroBody: 'Satuwork deploys task-executing AI agents into your team\u2019s workflow, handling repetitive work around the clock.',
    privacy: 'Privacy', terms: 'Terms',
    title: 'Sign in to Satuwork', subtitle: 'Enter the console to manage your AI employees',
    email: 'Email', password: 'Password', pwPlaceholder: 'Enter your password',
    forgot: 'Forgot password? Contact us', signIn: 'Sign in',
    noAccount: 'No account yet?', contactUs: 'Contact us to get access',
  },
};

class Component extends DCLogic {
  state = { lang: 'zh' };

  handleLogin = (e) => { e.preventDefault(); window.location.href = 'Satuwork Dashboard.dc.html'; };
  noop = (e) => { e && e.preventDefault(); };

  renderVals() {
    const lang = this.state.lang;
    return {
      t: COPY[lang],
      isZh: lang === 'zh',
      isEn: lang === 'en',
      setZh: () => this.setState({ lang: 'zh' }),
      setEn: () => this.setState({ lang: 'en' }),
      handleLogin: this.handleLogin,
      noop: this.noop,
    };
  }
}
</script>
</body>
</html>
