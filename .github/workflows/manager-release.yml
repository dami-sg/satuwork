# 构建机器管家发布包：建 GitHub Release + 传给 Gateway。
#
# 和 bot-release 是同一套流程，区别只在包和上传路径（/platform/manager-releases）。
# 但影响面不一样：**机器上的管家会自己升到这个版本**——心跳时 Gateway 下发期望
# 版本，各台机器自行换版。所以推 tag 之前先想清楚要不要立刻全量。
#
# 灰度/回滚都在 Gateway 侧：owner 在管家发布页把「期望版本」设成某一版，机器下一
# 轮心跳就跟过去。传包本身不会立刻改变任何一台机器——除非期望版本是空的（那时
# 跟最新发布走）。
#
# **两个架构分别出包。** 包里带 esbuild 的原生二进制，架构不对就起不来。好在管家
# 换版前会拿新包跑一次 `--selftest`，架构不对会在那一步失败、`current` 不动、原因
# 报回心跳——不会变砖，但也升不上去。版本号带架构后缀，两份包是两条独立发布记录。
#
# 需要两个 secret：GATEWAY_URL、GATEWAY_PLATFORM_TOKEN。
name: manager-release

on:
  push:
    tags: ['manager-v*']
  workflow_dispatch:
    inputs:
      note:
        description: 这次发布的说明
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pack.mjs 走 `pnpm deploy`，要先有装好的 workspace。
      - run: pnpm install --frozen-lockfile

      # 管家包里的 TypeScript 是运行时才转的，编译期兜不住的错只有 tsc 能看见。
      # 这一步失败就别发：装出去的管家起不来，机器上没有 SSH 可以救。
      - run: pnpm --filter satuwork-manager typecheck

      - name: 校验 runner 架构
        run: |
          got=$(node -p 'process.arch')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got，矩阵却说 ${{ matrix.arch }}" >&2; exit 1; }

      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            base="${GITHUB_REF_NAME#manager-v}"
          else
            base=$(node -p "require('./manager/package.json').version")
          fi
          echo "v=${base}+${GITHUB_SHA:0:7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: 打包
        run: node manager/pack.mjs --version "${{ steps.version.outputs.v }}"

      - uses: actions/upload-artifact@v4
        with:
          name: manager-pack-${{ matrix.arch }}
          path: dist/manager-*.tgz
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manager-pack-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "${NOTE:-管家发布包（x64 / arm64）。没 pin 期望版本的机器会在下一轮心跳自动升到最新。}"

      # 顺序有意：arm64 先、x64 后，让 x64 稳定地成为「最新」。理由见 bot-release.yml。
      # 管家这条尤其要紧——没 pin 的机器会自动跟最新走，随机的「最新」等于随机换架构。
      - name: 传给 Gateway
        env:
          TOK: ${{ secrets.GATEWAY_PLATFORM_TOKEN }}
          GW: ${{ secrets.GATEWAY_URL }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for arch in arm64 x64; do
            # 直接用 glob，不解析 ls 的输出；顺带断言「正好一个」——多出来的陈旧
            # artifact 会让上传传错文件，而那是查不出来的。
            files=(dist/manager-*-"$arch".tgz)
            [ ${#files[@]} -eq 1 ] || { echo "期望正好一个 $arch 包，实际 ${#files[@]}" >&2; exit 1; }
            f="${files[0]}"
            v=$(basename "$f" .tgz); v=${v#manager-}
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            echo "PUT $arch $v"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
              "${GW%/}/platform/manager-releases/$(jq -rn --arg v "$v" '$v|@uri')?note=$(jq -rn --arg n "${NOTE:-}" '$n|@uri')" \
              -H "authorization: Bearer $TOK" \
              -H 'content-type: application/gzip' \
              -H "x-bot-sha256: $sha" \
              --data-binary "@$f")
            echo "  -> $code $(head -c 300 /tmp/resp.json)"
            [ "$code" = "200" ] || [ "$code" = "201" ] || exit 1
          done
