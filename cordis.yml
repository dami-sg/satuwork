# Satuwork 的根组合。
#
# 每一行是一个插件条目：`name` 是模块说明符（相对路径或 npm 包名）。条目**并发**
# 挂载，先后顺序不由行序决定，而由 `inject` 的服务依赖决定——所以这里的排列只是
# 给人看的分组，不是加载顺序。
#
# 启动：`pnpm dev`（bin/satuwork.mjs 建根 Context、挂 Loader、读本文件）
#
# 框架包用 DeepSeek vendor 的那套（@deepseek-ai/cordis 4.0.1，上游主线还在 RC）；
# dsh 的产品包一个不用。

# ── 基础设施 ──────────────────────────────────────────────────────────────
- name: '@deepseek-ai/cordis-plugin-timer'

- name: '@cordisjs/plugin-server'
  config:
    host: 127.0.0.1
    port: 3082

# ── Satuwork ──────────────────────────────────────────────────────────────
- name: './src/web/index.ts'
