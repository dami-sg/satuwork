# ── Satuwork 自己的前端 ───────────────────────────────────────────────────
# 接管 webServer 的 SPA 座位发 ui/dist，并挂我们自己的 API 路由。dsh 的浏览器
# 客户端（web-runtime 与全部 ui-* / client-*）在上面已停用——座位只能有一个主人。
- id: satu-web
  name: satuwork-harness/web
