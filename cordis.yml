# Satuwork 的根组合。
#
# 每行一个插件条目，`name` 是模块说明符。条目**并发**挂载——先后由 `inject` 的服务
# 依赖决定，不由行序决定。下面的分组只是给人看的。
#
# 启动：`pnpm dev`
#
# 框架用 DeepSeek vendor 的那套（@deepseek-ai/cordis 4.0.1，上游主线还在 RC）；
# dsh 的产品包一个不用，产品代码全部在 src/ 下。

# ── 基础设施 ──────────────────────────────────────────────────────────────
- name: '@deepseek-ai/cordis-plugin-timer'

- name: '@cordisjs/plugin-server'
  config:
    host: 127.0.0.1
    port: 3082

# ── 核心 ──────────────────────────────────────────────────────────────────
# 运行时配置与非会话数据（SQLite，$SATUWORK_HOME/satuwork.db）。
# 会话日志不在这里——那是追加式 JSONL，两种数据的访问形态不一样。
- name: './src/storage/index.ts'

# 事件日志。一切从它派生：模型看到的历史、UI、以后的投影与统计。
- name: './src/session/index.ts'

# 账号与会话。守卫用 server.use（prepend），跑在所有路由之前——没有会话的
# `/api/*` 在路由之前就被挡住，前端那次跳转只是体验。
- name: './src/auth/index.ts'

# 模型接缝，底下是 @earendil-works/pi-ai（40 家 provider 的目录、协议、鉴权、单价）。
# 加一个 provider 是配置，不是代码。
- name: './src/llm/index.ts'

# 工具注册表与执行管道；策略挂在它的 waterfall 上。
- name: './src/tools/index.ts'
- name: './src/tools/builtin.ts'

# turn/step 循环，把上面三者串起来。
- name: './src/agent/index.ts'
  config:
    provider: deepseek
    model: deepseek-v4-flash
    system: 你是 Satuwork 的 AI 员工。用简洁、专业的中文回答。需要当前时间或精确计算时调用工具，不要凭猜测。

# ── 前端 ──────────────────────────────────────────────────────────────────
# 客户端模块表：插件在这里登记自己的浏览器半边，shell 启动时按这张图挂载。
- name: './src/web/client.ts'

# shell 与 API。
- name: './src/web/index.ts'

# ── 各屏 ──────────────────────────────────────────────────────────────────
# 一屏一个插件，注释掉一行，那一屏连同它的导航项一起消失——UI 的生命周期与插件
# 的生命周期是同一条轴。
- name: './src/views/auth/index.ts'
- name: './src/views/layout/index.ts'
- name: './src/views/chat/index.ts'
# 模型配置：整屏真数据（pi-ai 目录 + 本机凭据 + 生效设置），没有 mock。
- name: './src/views/models/index.ts'

# Skill 与 MCP：内置工具那一段是真的（读 ctx.tools），其余 mock。
- name: './src/views/skills/index.ts'

# 后端还没有的屏：路由回的是 mock.ts 里的假数据，响应里带 `mock: true`。
- name: './src/views/tasks/index.ts'
- name: './src/views/agents/index.ts'
- name: './src/views/accounts/index.ts'
- name: './src/views/usage/index.ts'
- name: './src/views/billing/index.ts'
- name: './src/views/profile/index.ts'
