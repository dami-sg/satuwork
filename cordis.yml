# Satuwork 的根组合。
#
# 每一行是一个插件条目：`name` 是模块说明符（相对路径或 npm 包名）。条目**并发**
# 挂载，先后顺序不由行序决定，而由 `inject` 的服务依赖决定——所以这里的排列只是
# 给人看的分组，不是加载顺序。
#
# 启动：`pnpm dev`（走 cordis 自带的 bin.js，它建根 Context、挂 Loader、读本文件）

# ── 基础设施 ──────────────────────────────────────────────────────────────
- name: '@cordisjs/logger'
- name: '@cordisjs/plugin-timer'

- name: '@cordisjs/plugin-server'
  config:
    host: 127.0.0.1
    port: 3082

# ── Satuwork ──────────────────────────────────────────────────────────────
- name: './src/web/index.ts'
