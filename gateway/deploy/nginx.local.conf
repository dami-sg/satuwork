# 本地验「反代会不会把 SSE 攒住」用的 nginx。**不是上线用的那份**（那份在
# nginx.conf.example，带 TLS 和 h2）。
#
# 这里刻意起两个 server，两边只差那四行：
#
#   :8080  照 nginx.conf.example 配   → check-sse 应该**通过**
#   :8081  故意用 nginx 的默认值      → check-sse 应该**失败**
#
# 两个都跑一遍才有意义：只跑通过的那个，你不知道这个测是不是根本抓不到东西。
#
# 不用 root、不碰 /etc、不碰系统的 nginx。**下面这几行可以整段贴进一个终端**——
# 假席位和 nginx 都带 `&` 丢到后台（这份配置是 `daemon off`，不丢后台会占住终端，
# 后面两条 check 就轮不到跑）：
#
#   brew install nginx                      # 或 apt-get install nginx
#   mkdir -p /tmp/sse-check/logs
#   node gateway/deploy/check-sse.mjs origin &                        # 假席位，:9099
#   nginx -p /tmp/sse-check -c "$PWD/gateway/deploy/nginx.local.conf" &
#   sleep 1
#   node gateway/deploy/check-sse.mjs check http://127.0.0.1:8080/sse   # 期望 ✅
#   node gateway/deploy/check-sse.mjs check http://127.0.0.1:8081/sse   # 期望 ❌
#   nginx -p /tmp/sse-check -s stop; kill %1
#
# 验完把 :8080 那一段的四行原样抄进上线那份配置即可——它们就是同一组设置。

daemon off;
worker_processes 1;
pid nginx.pid;
error_log logs/error.log;
events { worker_connections 64; }

http {
  access_log off;
  client_body_temp_path client_body_temp;
  proxy_temp_path proxy_temp;
  fastcgi_temp_path fastcgi_temp;
  uwsgi_temp_path uwsgi_temp;
  scgi_temp_path scgi_temp;

  # ── 照上线那份配的 ──────────────────────────────────────────────
  server {
    listen 127.0.0.1:8080;
    location / {
      proxy_pass http://127.0.0.1:9099;
      proxy_http_version 1.1;
      proxy_set_header Connection '';

      # 这四行就是命门，和 nginx.conf.example 里那四行一字不差。
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }

  # ── 故意用默认值：证明上面那四行不是摆设 ────────────────────────
  #
  # nginx 默认 `proxy_buffering on`，而一批帧灌完就安静下来的 SSE 会被整段扣在缓冲里
  # ——再也没有新字节来把它顶出去。这正是线上那个「历史缺一截 + 永远挂着正在处理」。
  server {
    listen 127.0.0.1:8081;
    location / {
      proxy_pass http://127.0.0.1:9099;
      proxy_http_version 1.1;
    }
  }
}
